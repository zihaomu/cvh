name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  headers_ui:
    name: Header-only UI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run header-only UI gate
        env:
          CVH_CI_PARALLEL: "2"
        run: ./scripts/ci_headers_all.sh

      - name: Upload machine-readable test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: header-test-reports-ui
          path: build-ci-headers-ui/test-reports/*.xml
          if-no-files-found: warn
