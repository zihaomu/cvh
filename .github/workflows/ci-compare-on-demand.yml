name: CI Compare On Demand

on:
  repository_dispatch:
    types: [cvh_compare_on]
  pull_request:
    types: [synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Optional PR number. If set, run against refs/pull/<pr>/merge."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: >
    ci-compare-on-demand-${{
      github.event_name == 'repository_dispatch' && github.event.client_payload.pr_number ||
      github.event_name == 'pull_request' && github.event.pull_request.number ||
      inputs.pr_number ||
      github.ref
    }}
  cancel-in-progress: true

jobs:
  opencv_compare_ui:
    name: OpenCV Compare UI
    if: >
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'ci/run-opencv-compare')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Resolve Target Ref
        id: resolve
        uses: actions/github-script@v9
        with:
          script: |
            const eventName = context.eventName;
            let prNumber = '';
            if (eventName === 'repository_dispatch') {
              prNumber = String(context.payload.client_payload?.pr_number || '');
            } else if (eventName === 'pull_request') {
              prNumber = String(context.payload.pull_request?.number || '');
            } else if (eventName === 'workflow_dispatch') {
              prNumber = String(context.payload.inputs?.pr_number || '');
            }

            const ref = prNumber ? `refs/pull/${prNumber}/merge` : context.ref;
            core.setOutput('pr_number', prNumber);
            core.setOutput('ref', ref);
            core.info(`opencv_compare_trigger=${eventName}, pr_number=${prNumber || 'n/a'}, ref=${ref}`);

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.resolve.outputs.ref }}

      - name: Run UI/OpenCV Compare (log-only)
        env:
          CVH_COMPARE_PROFILE: quick
          CVH_COMPARE_IMPLS: headers_fast
          CVH_COMPARE_THREADS: "1"
          CVH_COMPARE_OMP_DYNAMIC: "false"
          CVH_COMPARE_OMP_PROC_BIND: "close"
          CVH_COMPARE_ARTIFACT_DIR: build-ci-compare-reports
        run: ./scripts/ci_compare_log_only.sh

      - name: Upload comparison reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: opencv-compare-ui
          path: build-ci-compare-reports/*
          if-no-files-found: warn
